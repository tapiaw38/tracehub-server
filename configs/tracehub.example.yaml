# TraceHub Configuration Example

services:
  # Payment Service
  - name: payment-service
    log_path: /var/log/payment/app.log
    format: json  # json, text, or plain
    repo_path: /home/user/projects/payment

  # Transfer Service
  - name: transfer-service
    log_path: /var/log/transfer/app.log
    format: json
    repo_path: /home/user/projects/transfer

  # Account Service
  - name: account-service
    log_path: /var/log/account/app.log
    format: text
    repo_path: /home/user/projects/account

detection:
  # Custom error patterns to detect
  patterns:
    - "panic:"
    - "nil pointer"
    - "connection refused"
    - "database error"
    - "authentication failed"

  # Keywords to classify error severity
  severity_keywords:
    critical:
      - "panic"
      - "fatal"
      - "crash"
    high:
      - "error"
      - "failed"
      - "exception"
    medium:
      - "warning"
      - "timeout"
      - "retry"

git:
  # Prefix for auto-generated branches
  branch_prefix: "autofix/"

  # Prefix for commit messages
  commit_prefix: "[AutoFix]"

claude:
  # Claude model to use
  # Options: claude-sonnet-4-20250514, claude-opus-4-20250514
  model: "claude-sonnet-4-20250514"

  # Maximum tokens for Claude responses
  max_tokens: 4000

  # API key should be set via ANTHROPIC_API_KEY environment variable
  # DO NOT commit your API key to version control
